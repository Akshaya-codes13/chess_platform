services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess_academy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_academy"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      args:
        # Test tools (pytest, httpx) for `docker compose exec backend pytest`.
        INSTALL_DEV: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ARQ worker: precomputes the daily report tables (app/worker.py).
  worker:
    build: ./backend
    command: arq app.worker.WorkerSettings
    env_file: ./backend/.env
    volumes:
      - ./backend:/code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  # Uploaded images (object storage for the local storage backend).
  media: